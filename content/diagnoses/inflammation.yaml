- id: dx-engorge
  area: inflammation
  name: Physiological engorgement
  flag: likely-normal
  steps:
    - Feed frequently and responsively; cold packs between feeds;
      reverse-pressure softening; NSAIDs.
    - Avoid aggressive pumping — it prolongs it.
    - Settles over 24–48 h.
  supports:
    - finding: inf1
      weight: 2
  against: []
- id: dx-galac
  area: inflammation
  name: Galactocele
  steps:
    - Confirm on ultrasound; aspirate if symptomatic or for diagnosis.
    - Recurrence is common while lactating.
    - Send fluid for analysis if atypical.
  supports:
    - finding: inf2
      weight: 2
    - finding: inf8
      weight: 2
  against:
    - finding: inf1
      weight: 1
    - finding: inf7
      weight: 1
- id: dx-ibc
  area: inflammation
  name: Exclude inflammatory breast cancer
  flag: do-not-miss
  note: The exit that must stay in mind at every rung of the mastitis ladder.
  steps:
    - Urgent breast imaging (ultrasound and mammography) and core biopsy of skin
      and any mass.
    - Do NOT repeat antibiotic courses without imaging.
    - Refer on a 2-week cancer pathway.
  seeAlso:
    - mim-ibc
  sources:
    - abm-36
  supports:
    - finding: inf9-peau
      weight: 3
    - finding: inf9-retract
      weight: 3
    - finding: inf9b
      weight: 3
    - finding: inf9-fixed
      weight: 2
    - finding: inf2
      weight: 1
  against:
    - finding: inf1
      weight: 1
    - finding: inf7
      weight: 1
    - finding: inf8
      weight: 1
- id: dx-recur
  area: inflammation
  name: Recurrent focal mastitis — image the site
  flag: often-mislabelled
  steps:
    - Ultrasound the affected area for an obstructing lesion, mass, or
      persistent bleb.
    - Treat the underlying oversupply; review bra and pump-flange fit.
    - If persistent or atypical, exclude malignancy.
  seeAlso:
    - dx-ibc
    - dx-oald
  supports:
    - finding: inf2
      weight: 2
    - finding: inf10
      weight: 2
  against:
    - finding: inf1
      weight: 1
    - finding: inf7
      weight: 1
    - finding: inf8
      weight: 1
    - finding: inf9-peau
      weight: 1
    - finding: inf9-retract
      weight: 1
- id: dx-lump
  area: inflammation
  name: Persistent breast lump — triple assessment
  flag: often-mislabelled
  note: A discrete lump that is not an abscess, galactocele, or resolving
    inflammation.
  steps:
    - "Triple assessment: clinical exam + imaging (ultrasound ± mammography) ±
      core biopsy."
    - "Differential: fibroadenoma, simple cyst, lactating adenoma, and
      non-lactational disease (periductal or idiopathic granulomatous mastitis,
      TB where endemic)."
    - Do not attribute a persistent lump to lactation without imaging.
  supports:
    - finding: inf2
      weight: 2
  against:
    - finding: inf1
      weight: 1
    - finding: inf7
      weight: 1
    - finding: inf8
      weight: 1
    - finding: inf9-peau
      weight: 1
    - finding: inf9-retract
      weight: 1
    - finding: inf10
      weight: 1
- id: dx-abscess
  area: inflammation
  name: Breast abscess
  steps:
    - Ultrasound-guided needle aspiration (repeat as needed) or drainage; send
      pus for culture.
    - Antibiotics covering S. aureus.
    - Keep removing milk; surgical referral.
  supports:
    - finding: inf3
      weight: 2
    - finding: inf4
      weight: 2
    - finding: inf5
      weight: 2
    - finding: inf4b
      weight: 1
  against:
    - finding: inf1
      weight: 1
    - finding: inf2
      weight: 1
- id: dx-phlegmon
  area: inflammation
  name: Phlegmon
  steps:
    - Ultrasound to confirm no abscess.
    - Continue or broaden antibiotics (IV if unwell).
    - Do NOT incise; watchful management with breast-surgery involvement.
  supports:
    - finding: inf3
      weight: 2
    - finding: inf4
      weight: 2
    - finding: inf6
      weight: 2
    - finding: inf4b
      weight: 1
  against:
