      weight: 1
    - finding: inf2
      weight: 1
    - finding: inf5
      weight: 1
- id: dx-bacterial
  area: inflammation
  name: Bacterial mastitis
  steps:
    - Anti-staphylococcal antibiotics (e.g. dicloxacillin / flucloxacillin, or
      cephalexin; cover MRSA per local rates).
    - Send a milk culture.
    - Continue feeding or expressing; adequate analgesia; escalate if no
      response in 48 h.
  coexists:
    - dx-trauma
    - dx-oald
  supports:
    - finding: inf3
      weight: 2
    - finding: inf4
      weight: 2
    - finding: inf4b
      weight: 1
  against:
    - finding: inf1
      weight: 1
    - finding: inf2
      weight: 1
    - finding: inf5
      weight: 1
    - finding: inf6
      weight: 1
- id: dx-inflammatory
  area: inflammation
  name: Inflammatory mastitis
  steps:
    - Conservative measures as for ductal inflammation, plus NSAIDs, adequate
      analgesia, and rest.
    - Review at 24 h.
    - Antibiotics are NOT first-line if symptoms are under 24 h and improving.
  supports:
    - finding: inf3
      weight: 2
  against:
    - finding: inf1
      weight: 1
    - finding: inf2
      weight: 1
    - finding: inf4
      weight: 1
- id: dx-plug
  area: inflammation
  name: Ductal narrowing / inflammation (‘plugged duct’)
  note: Reframed in 2022 as duct-wall oedema and inflammation on a hyperlactation
    background — not a discrete ‘plug’ to push out.
  steps:
    - Keep to the NORMAL feeding schedule — do not try to ‘empty’ the breast.
    - Ice, NSAIDs, gentle lymphatic drainage toward the axilla, therapeutic
      ultrasound.
    - AVOID deep massage, heat, extra pumping, and saline soaks.
    - Treat the underlying oversupply.
  seeAlso:
    - dx-oald
    - dx-bleb
  coexists:
    - dx-oald
    - dx-bleb
  supports: []
  against:
    - finding: inf1
      weight: 1
    - finding: inf2
      weight: 1
    - finding: inf3
      weight: 1
- id: mim-ibc
  area: inflammation
  name: "Mimic: non-resolving mastitis vs breast cancer"
  flag: do-not-miss
  note: Both give a red, swollen, warm breast.
  points:
    - "Mastitis: onset over hours to a day or two, systemic symptoms, responds
      to conservative care ± antibiotics within 48 h."
    - "IBC: does not settle on antibiotics, peau d'orange, skin thickening,
      nipple retraction, a fixed mass, axillary nodes; may arise outside the
      postpartum window."
  steps:
    - If a breast has not clearly improved after an appropriate antibiotic
      course → imaging and core biopsy, NOT another prescription.
  seeAlso:
    - dx-ibc
    - dx-bacterial
  reference: true
