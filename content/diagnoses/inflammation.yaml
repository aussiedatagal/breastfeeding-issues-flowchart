- id: dx-engorge
  name: Physiological engorgement
  flag: likely-normal
  steps:
    - Feed frequently and responsively; cold packs between feeds; reverse-pressure softening;
      NSAIDs.
    - Avoid aggressive pumping — it prolongs it.
    - Settles over 24–48 h.
- id: dx-galac
  name: Galactocele
  steps:
    - Confirm on ultrasound; aspirate if symptomatic or for diagnosis.
    - Recurrence is common while lactating.
    - Send fluid for analysis if atypical.
- id: dx-ibc
  name: Exclude inflammatory breast cancer
  flag: do-not-miss
  note: The exit that must stay in mind at every rung of the mastitis ladder.
  steps:
    - Urgent breast imaging (ultrasound and mammography) and core biopsy of skin and any mass.
    - Do NOT repeat antibiotic courses without imaging.
    - Refer on a 2-week cancer pathway.
  seeAlso:
    - mim-ibc
- id: dx-recur
  name: Recurrent focal mastitis — image the site
  flag: often-mislabelled
  steps:
    - Ultrasound the affected area for an obstructing lesion, mass, or persistent bleb.
    - Treat the underlying oversupply; review bra and pump-flange fit.
    - If persistent or atypical, exclude malignancy.
  seeAlso:
    - dx-ibc
    - dx-oald
- id: dx-lump
  name: Persistent breast lump — triple assessment
  flag: often-mislabelled
  note: A discrete lump that is not an abscess, galactocele, or resolving inflammation.
  steps:
    - "Triple assessment: clinical exam + imaging (ultrasound ± mammography) ± core biopsy."
    - "Differential: fibroadenoma, simple cyst, lactating adenoma, and non-lactational disease
      (periductal or idiopathic granulomatous mastitis, TB where endemic)."
    - Do not attribute a persistent lump to lactation without imaging.
- id: dx-abscess
  name: Breast abscess
  steps:
    - Ultrasound-guided needle aspiration (repeat as needed) or drainage; send pus for culture.
    - Antibiotics covering S. aureus.
    - Keep removing milk; surgical referral.
- id: dx-phlegmon
  name: Phlegmon
  steps:
    - Ultrasound to confirm no abscess.
    - Continue or broaden antibiotics (IV if unwell).
    - Do NOT incise; watchful management with breast-surgery involvement.
- id: dx-bacterial
  name: Bacterial mastitis
  steps:
    - Anti-staphylococcal antibiotics (e.g. dicloxacillin / flucloxacillin, or cephalexin; cover
      MRSA per local rates).
    - Send a milk culture.
    - Continue feeding or expressing; adequate analgesia; escalate if no response in 48 h.
  coexists:
    - dx-trauma
    - dx-oald
- id: dx-inflammatory
  name: Inflammatory mastitis
  steps:
    - Conservative measures as for ductal inflammation, plus NSAIDs, adequate analgesia, and
      rest.
    - Review at 24 h.
    - Antibiotics are NOT first-line if symptoms are under 24 h and improving.
- id: dx-plug
  name: Ductal narrowing / inflammation (‘plugged duct’)
  note: Reframed in 2022 as duct-wall oedema and inflammation on a hyperlactation background — not
    a discrete ‘plug’ to push out.
  steps:
    - Keep to the NORMAL feeding schedule — do not try to ‘empty’ the breast.
    - Ice, NSAIDs, gentle lymphatic drainage toward the axilla, therapeutic ultrasound.
    - AVOID deep massage, heat, extra pumping, and saline soaks.
    - Treat the underlying oversupply.
  seeAlso:
    - dx-oald
    - dx-bleb
  coexists:
    - dx-oald
    - dx-bleb
