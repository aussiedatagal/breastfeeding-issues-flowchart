- id: dx-paget
  area: pain
  name: Other nipple skin lesion — exclude Paget's disease
  flag: often-mislabelled
  note: A unilateral, persistent, eczema-like change of the nipple that does not
    respond to topical treatment must be biopsied — Paget's disease of the
    nipple.
  steps:
    - Dermatology / breast referral; full-thickness biopsy of persistent
      unilateral change.
    - Treat the likely benign cause meanwhile, with a firm review date.
    - Do not attribute a non-resolving unilateral lesion to ‘thrush’ or
      dermatitis indefinitely.
  supports:
    - finding: pain3
      weight: 2
  against:
    - finding: pain1
      weight: 1
