- id: dx-deeppain
  area: pain
  name: Deep pain, exam normal — cause not yet identified
  note: >
    A genuine residual once mechanical, skin, vascular, infective, dysbiotic and
    central-sensitisation causes have all been worked through. Not a
    place-holder for ‘unexplained thrush’.
  steps:
    - Re-verify latch and pump-flange size; watch a full feed and a pumping
      session.
    - Reconsider vasospasm, dysbiosis and allodynia — the features can be subtle.
    - Screen mood; consider a milk culture; multidisciplinary pain approach if
      it persists.
    - Empirical antifungal or antibiotic is NOT recommended without
      corroborating signs — infant oral thrush, satellite areolar rash, or a
      positive culture.
  seeAlso:
    - mim-thrush
    - dx-raynaud
    - dx-dysbiosis
    - dx-allodynia
  supports: []
