- id: cycle-damage
  area: pain
  name: "Cycle: nipple damage → infection"
  flag: often-mislabelled
  note: poor latch → fissure → S. aureus colonisation → pain + poor healing →
    shallower latch to avoid pain → more damage.
  steps:
    - "BREAK IT: latch correction + wound care + treat / decolonise S. aureus
      together — fixing only one arm lets the loop continue."
  seeAlso:
    - dx-trauma-inf
    - dx-position
  reference: true
- id: mim-thrush
  area: pain
  name: "Mimic: vasospasm vs ‘ductal thrush’"
  flag: often-mislabelled
  note: Both present as deep, burning, often bilateral pain with a near-normal exam.
  points:
    - "Vasospasm: visible white → blue → red colour change, a cold trigger,
      relief with warmth."
    - "Candidiasis of the lactating breast: a contested entity — require
      corroborating signs (infant oral thrush, satellite areolar rash, or
      culture) before antifungals."
  steps:
    - Trial vasospasm management; re-check latch and flange; consider
      persistent-pain pathways. Avoid reflexive empirical antifungals.
  seeAlso:
    - dx-raynaud
    - dx-deeppain
  reference: true
- id: mim-dmer
  area: pain
  name: "Mimic: D-MER vs postnatal depression"
  flag: often-mislabelled
  note: Both involve low mood in a breastfeeding parent.
  points:
    - "D-MER: an abrupt wave of dysphoria seconds before let-down, clearing
      within 30–90 s, every ejection, otherwise well."
    - "PND / anxiety: pervasive low mood, anhedonia or anxiety not tied to
      let-down."
  steps:
    - "Track the timing against feeds. D-MER: validate and reassure. Pervasive
      symptoms: screen and refer (the two can coexist)."
  seeAlso:
    - dx-dmer
  reference: true
