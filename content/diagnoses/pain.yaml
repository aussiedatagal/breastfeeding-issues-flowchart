- id: dx-latchpain
  area: pain
  name: Latch / positioning pain
  steps:
    - Optimise latch and positioning; asymmetric latch, deeper gape.
    - Expect rapid improvement — review in a few days.
    - If pain persists despite a good latch, reassess for infant oral
      restriction and reconsider the pain axes below.
  supports:
    - finding: pain1
      weight: 2
  against: []
- id: dx-hsv
  area: pain
  name: HSV or bullous impetigo of the nipple
  flag: do-not-miss
  steps:
    - "HSV: do NOT feed from the affected breast until lesions crust — express
      and discard that side; systemic aciclovir."
    - Neonatal HSV is life-threatening — urgent paediatric advice.
    - "Impetigo: topical or oral antibiotics per severity; can usually keep
      feeding."
  supports:
    - finding: pain3
      weight: 2
    - finding: pain4
      weight: 2
  against:
    - finding: pain1
      weight: 1
    - finding: pain2
      weight: 1
- id: dx-trauma-inf
  area: pain
  name: Nipple trauma with S. aureus infection
  steps:
    - Swab; start empirical anti-staphylococcal treatment (cover MRSA per local
      rates).
    - Fix the mechanical cause in parallel — latch, flange size.
    - Moist wound healing; review healing at 48–72 h.
