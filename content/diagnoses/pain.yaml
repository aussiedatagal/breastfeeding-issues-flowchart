- id: dx-allodynia
  area: pain
  name: Allodynia / functional (central sensitisation) pain
  flag: often-mislabelled
  note: A diagnosis in its own right once mechanics, skin, vascular and infective
    causes are excluded — not a place-holder for ‘unexplained thrush’.
  steps:
    - Re-verify latch and pump-flange size; treat any coexisting vasospasm.
    - Screen for and treat mood disorder; ask about other chronic pain syndromes.
    - Multidisciplinary pain approach — consider a pain service, TCA/SNRI,
      psychological therapy.
    - Empirical antifungal or antibiotic is NOT indicated.
  seeAlso:
    - dx-raynaud
    - dx-deeppain
  supports:
