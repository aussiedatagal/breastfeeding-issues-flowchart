      weight: 1
- id: dx-dmer
  area: pain
  name: D-MER (dysphoric milk ejection reflex)
  flag: often-mislabelled
  steps:
    - Name it and validate it — recognition alone helps.
    - Distinguish from postnatal depression / anxiety (pervasive, not
      time-locked) and from intrusive thoughts.
    - Most improves with time; refer for mood support if severe, persistent, or
      coexisting with depression.
  seeAlso:
    - mim-dmer
  supports:
