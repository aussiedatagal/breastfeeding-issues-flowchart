- id: dx-dysbiosis
  area: pain
  name: Mammary dysbiosis / subacute mastitis
  flag: often-mislabelled
  note: >
    This is what is usually meant by "ductal thrush" — but Candida rarely causes
    it. It is a bacterial biofilm problem (coagulase-negative staph, viridans
    strep) on a background of unresolved oversupply.
  steps:
    - Bring an excessive supply down first — it is the main driver.
    - Anti-inflammatory measures; treat blebs and blocked ducts; avoid deep
      massage and extra pumping.
    - Milk culture and sensitivities before antibiotics; consider probiotics.
    - Do NOT treat empirically as Candida.
  seeAlso:
    - mim-thrush
    - dx-recur
    - dx-bleb
  coexists:
    - dx-oald
    - dx-bleb
    - dx-plug
  supports:
