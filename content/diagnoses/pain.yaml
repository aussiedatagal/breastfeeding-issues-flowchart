      weight: 1
    - finding: pain4
      weight: 1
    - finding: pain5
      weight: 1
    - finding: pain7
      weight: 1
- id: dx-bleb
  area: pain
  name: Bleb (milk blister) ± blocked duct
  steps:
    - Warm soak then feed; do NOT routinely unroof.
    - Treat as ductal inflammation — cold, NSAIDs, gentle lymphatic drainage;
      avoid deep massage and extra pumping.
    - Address the underlying oversupply; check bra and flange fit.
    - Recurrent → review, consider lecithin, image if fixed.
  seeAlso:
    - dx-plug
    - dx-oald
  coexists:
    - dx-plug
    - dx-oald
  supports:
    - finding: pain8
      weight: 2
  against:
    - finding: pain1
      weight: 1
    - finding: pain2
      weight: 1
    - finding: pain3
      weight: 1
- id: dx-raynaud
  area: pain
  name: Vasospasm / Raynaud's of the nipple
  steps:
    - Warmth immediately after feeds; avoid cold exposure, caffeine and nicotine.
    - Correct any latch component — compression provokes vasospasm.
    - Nifedipine if severe and persistent.
  seeAlso:
    - mim-thrush
    - dx-deeppain
  coexists:
