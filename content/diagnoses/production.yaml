- id: dx-second
  name: Secondary downregulation / supplementation spiral
  flag: often-mislabelled
  note: Almost always a removal problem, often iatrogenic. Fix the frequency and the completeness
    of removal and supply usually recovers.
  steps:
    - Increase feed and expression frequency; make sure transfer is effective.
    - Wean unnecessary supplements gradually to a written plan; trigger top-ups by weight, not
      anxiety.
    - At-breast supplementer; power-pumping; correct the root latch or transfer problem.
    - Reduce dummy use; feed at early cues.
  seeAlso:
    - a1
    - dx-perceived
  coexists:
    - dx-oral
    - dx-lac2
    - dx-igt
- id: dx-surg
  name: Post-surgical / structural production limit
  steps:
    - Assess for ductal and nerve disruption; check nipple sensation.
    - An at-breast supplementer plus a galactagogue trial.
    - Realistic counselling — supply is often partial and better with each subsequent lactation.
- id: dx-endo
  name: Endocrine / drug / pregnancy-related low supply
  steps:
    - Check TSH and free T4, prolactin, and glucose; endocrinology if abnormal.
    - Obstetric referral for suspected retained products — supply usually recovers after
      evacuation.
    - Stop or switch the offending drug where possible (progestogen-only or non-hormonal
      contraception; avoid decongestants).
    - If pregnant, counsel that some decline is expected.
- id: dx-idio
  name: Idiopathic low supply
  note: No primary, removal, surgical, endocrine or drug cause identified.
  steps:
    - Optimise removal and confirm effective transfer with an IBCLC.
    - Trial a galactagogue only after removal is optimised.
    - Bridge with an at-breast supplementer; reassess in 1–2 weeks.
    - Re-screen for a subtle cause (posterior tongue restriction, occult thyroid disease,
      retained products).
- id: dx-igt
  name: Primary glandular insufficiency (IGT)
  flag: often-mislabelled
  note: A production ceiling, present from the outset despite good technique and frequency.
    Partial supply is still valuable.
  steps:
    - Optimise removal (8–12 effective feeds/expressions per 24 h).
    - An at-breast supplementer bridges the shortfall while preserving stimulation and the
      feeding relationship.
    - Galactagogue trial only after removal is optimised.
    - Refer to an IBCLC; counsel that capacity often improves with each subsequent lactation.
  coexists:
    - dx-second
- id: dx-lac2
  name: Delayed lactogenesis II
  steps:
    - Intensive effective removal — feed plus express, 8–12×/24 h; skin-to-skin.
    - Treat the contributing factor (glycaemic control, thyroid, pain, retained products).
    - Bridge with an at-breast supplementer while supply builds; reassess transfer in 24–48 h.
    - Most establish over days to 2–3 weeks with support.
  seeAlso:
    - dx-endo
  coexists:
    - dx-second
