    - finding: ref4
      weight: 1
    - finding: ref5
      weight: 1
- id: dx-aversion
  area: refusal
  name: Oral aversion
  steps:
    - Gentle, non-pressured re-introduction; responsive feeding; never force.
    - Feeding therapy (SLT / OT); treat any underlying pain.
    - Positive oral experiences away from hunger; skin-to-skin.
