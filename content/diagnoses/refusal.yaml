- id: dx-slowflow
  area: refusal
  name: Slow-flow / low-supply frustration
  note: If weight gain is faltering, this belongs in the low-intake branch —
    confirm intake and supply.
  steps:
    - Watch a full feed and check the growth chart.
    - Support latch and transfer; an at-breast supplementer while building
      supply.
    - Work the production questions if supply is the issue.
  seeAlso:
