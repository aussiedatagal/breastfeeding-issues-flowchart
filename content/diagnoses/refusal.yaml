- id: dx-refuse-unk
  area: refusal
  name: Breast refusal — cause not yet identified
  steps:
    - IBCLC review with a full feed observation.
    - Protect the parent's supply with regular expression while investigating.
    - Trial skin-to-skin, bath-feeding, and feeding in motion.
    - Reassess in a few days — most declare a cause or resolve.
