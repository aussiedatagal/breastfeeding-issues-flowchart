- id: dx-endo
  area: supply
  name: Endocrine / drug / pregnancy-related low supply
  steps:
    - Check TSH and free T4, prolactin, and glucose; endocrinology if abnormal.
    - Obstetric referral for suspected retained products — supply usually
      recovers after evacuation.
    - Stop or switch the offending drug where possible (progestogen-only or
      non-hormonal contraception; avoid decongestants).
    - If pregnant, counsel that some decline is expected.
