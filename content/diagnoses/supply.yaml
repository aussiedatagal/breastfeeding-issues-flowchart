- id: dx-oald-a
  area: supply
  name: Overactive let-down / oversupply disrupting feeding
  note: Usually causes rapid weight gain — but marked refusal or one-sided
    drainage can tip an infant into poor gain.
  steps:
    - Finish the first breast before offering the second; block feeding if
      marked.
    - Laid-back or side-lying positioning; brief pre-latch expression to take
      the initial force off.
    - Stop rescue pumping. Most settles by ~12 weeks.
    - If gain stays poor, reassess transfer and consider a coexisting problem.
  seeAlso:
