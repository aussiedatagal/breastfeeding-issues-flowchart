- id: dx-barrier
  area: supply
  name: Mechanical barrier — engorgement or nipple shape
  steps:
    - Reverse-pressure softening and a little hand expression before latching.
    - Laid-back positioning; cold packs between feeds; NSAIDs for engorgement.
    - Nipple-everting techniques; a shield as a short-term bridge with a plan
      and weight monitoring.
    - Reassess as the infant grows and engorgement settles.
