- id: dx-igt
  area: supply
  name: Primary glandular insufficiency (IGT)
  flag: often-mislabelled
  note: A production ceiling, present from the outset despite good technique and
    frequency. Partial supply is still valuable.
  steps:
    - Optimise removal (8–12 effective feeds/expressions per 24 h).
    - An at-breast supplementer bridges the shortfall while preserving
      stimulation and the feeding relationship.
    - Galactagogue trial only after removal is optimised.
    - Refer to an IBCLC; counsel that capacity often improves with each
      subsequent lactation.
  coexists:
    - dx-second
  supports:
    - finding: a1
      weight: 2
    - finding: a8
      weight: 2
  against:
    - finding: q1
      weight: 1
    - finding: a7
      weight: 1
- id: dx-lac2
  area: supply
  name: Delayed lactogenesis II
  steps:
    - Intensive effective removal — feed plus express, 8–12×/24 h; skin-to-skin.
    - Treat the contributing factor (glycaemic control, thyroid, pain, retained
      products).
    - Bridge with an at-breast supplementer while supply builds; reassess
      transfer in 24–48 h.
    - Most establish over days to 2–3 weeks with support.
  seeAlso:
    - dx-endo
  coexists:
    - dx-second
  supports:
