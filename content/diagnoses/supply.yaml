- id: dx-suck
  area: supply
  name: Weak or uncoordinated suck (immaturity or neuromotor)
  steps:
    - Support tone and head position; external pacing; breast compression;
      shorter, more frequent feeds.
    - Physiotherapy / OT / SLT; paediatric review for abnormal neurology.
    - Recheck as the infant matures or the cause resolves.
