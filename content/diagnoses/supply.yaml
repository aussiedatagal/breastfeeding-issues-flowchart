- id: dx-idio
  area: supply
  name: Idiopathic low supply
  note: No primary, removal, surgical, endocrine or drug cause identified.
  steps:
    - Optimise removal and confirm effective transfer with an IBCLC.
    - Trial a galactagogue only after removal is optimised.
    - Bridge with an at-breast supplementer; reassess in 1–2 weeks.
    - Re-screen for a subtle cause (posterior tongue restriction, occult thyroid
      disease, retained products).
