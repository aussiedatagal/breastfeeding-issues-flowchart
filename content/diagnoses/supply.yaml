- id: dx-second
  area: supply
  name: Secondary downregulation / supplementation spiral
  flag: often-mislabelled
  note: Almost always a removal problem, often iatrogenic. Fix the frequency and
    the completeness of removal and supply usually recovers.
  steps:
    - Increase feed and expression frequency; make sure transfer is effective.
    - Wean unnecessary supplements gradually to a written plan; trigger top-ups
      by weight, not anxiety.
    - At-breast supplementer; power-pumping; correct the root latch or transfer
      problem.
    - Reduce dummy use; feed at early cues.
  seeAlso:
    - dx-perceived
  coexists:
    - dx-oral
    - dx-lac2
    - dx-igt
  supports:
    - finding: a1
      weight: 2
    - finding: a7
      weight: 2
    - finding: a10
      weight: 2
  against:
    - finding: q1
      weight: 1
- id: dx-surg
  area: supply
  name: Post-surgical / structural production limit
  steps:
    - Assess for ductal and nerve disruption; check nipple sensation.
    - An at-breast supplementer plus a galactagogue trial.
    - Realistic counselling — supply is often partial and better with each
      subsequent lactation.
