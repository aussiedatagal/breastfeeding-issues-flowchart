- id: dx-oald
  area: supply
  name: Oversupply & overactive let-down
  flag: often-mislabelled
  note: One physiology — excess production with brisk ejection — that presents as
    reflux, CMPA, colic, refusal, recurrent blocked ducts, and even perceived
    low supply.
  points:
    - Choking, gulping, clamping, pulling off as milk sprays; short efficient
      feeds; refusing the second breast.
    - Gassy, straining, frequent large explosive green frothy stools; rapid
      weight gain.
    - Recurrent engorgement and blocked ducts; forceful spray on release.
  steps:
    - Finish the first breast before offering the second; block feeding (one
      breast per 2–4 h) if marked.
    - Laid-back or side-lying positioning; brief pre-latch expression.
    - Stop rescue pumping — it feeds the loop.
    - Most self-corrects by ~12 weeks.
  seeAlso:
    - mim-cmpa
    - dx-plug
    - dx-fastflow
    - dx-perc-over
  reference: true
- id: mim-tie
  area: supply
  name: "Mimic: posterior tongue restriction vs immaturity"
  flag: often-mislabelled
  note: Both give a disorganised early latch that ‘might just need practice’.
  points:
    - "Restriction: persistent maternal pain, clicking, milk spilling, poor
      weight gain, reflux-like symptoms from aerophagia, restricted tongue
      elevation on a structured assessment."
    - "Immaturity: late-preterm / early-term, improving week on week, adequate
      transfer, less maternal pain."
  steps:
    - Use a validated oral-function assessment plus the weight trajectory;
      frenotomy only for demonstrated functional restriction.
  seeAlso:
    - dx-oral
    - dx-suck
  reference: true
- id: dx-perc-over
  area: supply
  name: Perceived low supply due to oversupply
  flag: often-mislabelled
  steps:
    - Show the growth chart; explain the physiology.
    - Manage as oversupply — finish the first breast, block feeding, stop rescue
      pumping.
    - Do NOT add pumping or galactagogues.
    - Reassure — most settles by ~12 weeks.
  seeAlso:
    - dx-oald
  coexists:
    - dx-oald
  supports:
    - finding: q1
      weight: 2
    - finding: b5
      weight: 2
  against: []
- id: dx-perceived
  area: supply
  name: Perceived insufficient milk supply (normal)
  flag: likely-normal
  note: A positive diagnosis made on normal growth and output — not a label of
    exclusion.
  steps:
    - Reassure with the objective data; show the growth chart.
    - Teach normal infant behaviour, hunger cues, cluster feeding, and the weeks
      6–12 regulation changes (softer breasts, shorter feeds, less leaking are
      all normal).
    - A low pump yield is a poor proxy for supply — say so.
    - Offer a review to confirm the trajectory rather than leaving the worry
      open.
  seeAlso:
    - dx-perc-over
  coexists:
    - dx-oald
    - dx-perc-over
  supports:
    - finding: q1
      weight: 2
  against:
    - finding: b5
      weight: 1
- id: dx-position
  area: supply
  name: Positioning & attachment problem
  steps:
