- id: dx-oral
  area: supply
  name: Infant oral restriction / structural anomaly
  flag: often-mislabelled
  steps:
    - Structured oral-function assessment (e.g. Hazelbaker) by an IBCLC or
      feeding team.
    - Positional compensation and pacing while deciding.
    - Frenotomy only for demonstrated functional restriction — not for
      appearance.
    - ENT / plastics / genetics for cleft, marked micrognathia (Pierre Robin),
      or macroglossia.
  seeAlso:
