- id: dx-position
  name: Positioning & attachment problem
  steps:
    - Hands-on latch and positioning correction; teach the parent to reproduce it.
    - Review within a few days.
    - If it recurs despite good technique, reassess for infant oral restriction.
  seeAlso:
    - a4
- id: dx-oald-a
  name: Overactive let-down / oversupply disrupting feeding
  note: Usually causes rapid weight gain — but marked refusal or one-sided drainage can tip an
    infant into poor gain.
  steps:
    - Finish the first breast before offering the second; block feeding if marked.
    - Laid-back or side-lying positioning; brief pre-latch expression to take the initial force
      off.
    - Stop rescue pumping. Most settles by ~12 weeks.
    - If gain stays poor, reassess transfer and consider a coexisting problem.
  seeAlso:
    - mim-cmpa
    - dx-fastflow
- id: dx-oral
  name: Infant oral restriction / structural anomaly
  flag: often-mislabelled
  steps:
    - Structured oral-function assessment (e.g. Hazelbaker) by an IBCLC or feeding team.
    - Positional compensation and pacing while deciding.
    - Frenotomy only for demonstrated functional restriction — not for appearance.
    - ENT / plastics / genetics for cleft, marked micrognathia (Pierre Robin), or macroglossia.
  seeAlso:
    - mim-tie
- id: dx-suck
  name: Weak or uncoordinated suck (immaturity or neuromotor)
  steps:
    - Support tone and head position; external pacing; breast compression; shorter, more
      frequent feeds.
    - Physiotherapy / OT / SLT; paediatric review for abnormal neurology.
    - Recheck as the infant matures or the cause resolves.
  seeAlso:
    - dx-cardio
- id: dx-cardio
  name: Cardiorespiratory disease
  flag: do-not-miss
  steps:
    - Paediatric or cardiology assessment; measure SpO₂ at rest and during a feed.
    - Pace feeds and allow breaks; fortify or supplement to reduce the work of feeding.
    - Overlaps the infant red-flag list — escalate if unwell.
- id: dx-barrier
  name: Mechanical barrier — engorgement or nipple shape
  steps:
    - Reverse-pressure softening and a little hand expression before latching.
    - Laid-back positioning; cold packs between feeds; NSAIDs for engorgement.
    - Nipple-everting techniques; a shield as a short-term bridge with a plan and weight
      monitoring.
    - Reassess as the infant grows and engorgement settles.
- id: dx-transfer-unk
  name: Ineffective transfer — cause not yet identified
  note: Transfer is poor but no single cause stands out.
  steps:
    - Refer to an IBCLC for repeated structured feed assessment.
    - Re-screen for subtle posterior tongue restriction, disorganised state regulation, and
      feeding frequency.
    - Reassess within days — the picture often declares itself.
