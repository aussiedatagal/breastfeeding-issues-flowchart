title: Breastfeeding Difficulty
intro: Answer what you can observe — skip anything you're not sure of. Nothing
  is ruled out unless your answers make it impossible. You get a ranked list of
  what fits, with how much each matches and which findings don't.
areas:
  - id: supply
    label: Not enough milk, poor weight gain, or supply feels low
    short: Milk supply & weight
  - id: pain
    label: Sore, cracked, burning, or a deep ache — at or between feeds
    short: Nipple & breast pain
  - id: inflammation
    label: A breast lump, or a red, hot, or inflamed area
    short: Lump or inflammation
  - id: refusal
    label: The baby fights, fusses at, or refuses the breast
    short: Fussing or refusing
multifactorialNote: >
  Treat each result as one contributing factor, not the whole answer. If it
  doesn't explain everything, pin it, revise an answer or two, or work another
  area — the aim is a problem list.
