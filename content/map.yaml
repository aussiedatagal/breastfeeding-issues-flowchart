title: Breastfeeding Difficulty
subtitle: Diagnoses the breastfeeding problem, not the infant's clinical care.

# The dyad may be dealing with several of these at once — they are separate
# problems, not one. The clinician opens every area that applies and works each.
rootPrompt: >
  Open every area that applies — they are not mutually exclusive. A tongue
  restriction, oversupply and cracked nipples can all be in play at once, and one
  often causes another.

domains:
  - id: supply
    label: Not enough milk, poor weight gain, or supply feels low
    short: Milk supply & weight
    entry: q1
  - id: pain
    label: Nipple or breast pain
    short: Nipple & breast pain
    entry: pain1
  - id: inflammation
    label: A breast lump, or a red, hot, or inflamed area
    short: Lump or inflammation
    entry: inf1
  - id: refusal
    label: The baby fights, fusses at, or refuses the breast
    short: Fussing or refusing
    entry: ref1

multifactorialNote: >
  This is one contributing factor — check that it explains the whole picture. If
  it does not, add it to Findings and open another area (or go back and work the
  other branch of this one). The result should be a problem list, not a single
  answer.
