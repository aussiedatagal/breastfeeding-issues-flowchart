title: Breastfeeding Difficulty
intro: >
  First, a few quick yes/no questions about what's going on. Then a few more
  about each thing you say yes to. Skip anything you're not sure about — you
  can't get it wrong. Your answers build a summary for your midwife, doctor, or
  lactation consultant.
areas:
  - id: supply
    label: Not enough milk, poor weight gain, or supply feels low
    short: Milk supply & weight
    ask: Has your baby been slow to gain weight, or are feeds hard work — very
      long, very frequent, or the baby rarely settled?
  - id: pain
    label: Sore, cracked, burning, or a deep ache — at or between feeds
    short: Nipple & breast pain
    ask: Does breastfeeding hurt?
  - id: inflammation
    label: A breast lump, or a red, hot, or inflamed area
    short: Lump or inflammation
    ask: Is part of your breast painful, red, swollen, or lumpy?
  - id: refusal
    label: The baby fights, fusses at, or refuses the breast
    short: Fussing or refusing
    ask: Does the baby fight or refuse the breast?
multifactorialNote: >
  Treat each result as one contributing factor, not the whole answer. If it
  doesn't explain everything, pin it, revise an answer or two, or screen another
  area — the aim is a problem list.
evidenceNote: >
  The questions and diagnoses are built on the sources below, current to early
  2026. The default population probabilities (priors) are provisional and not
  yet individually referenced — verify against current guidance before relying
  on the ranking. This tool is educational and does not replace hands-on
  assessment.
