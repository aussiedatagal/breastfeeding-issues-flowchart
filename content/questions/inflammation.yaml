# Questions the PARENT answers, in plain language. `short` is the label on the
# clinician's results grid. `showIf` hides a question from the parent's flow when
# it wouldn't make sense — the finding then stays unknown (nothing is ruled out).

- id: inf1
  area: inflammation
  type: boolean
  ask: In the first 2 to 5 days after birth, were BOTH breasts full, firm, and
    tender all over?
  short: Both breasts, firm all over, day 2–5?
  assess: >
    Normal early engorgement affects both breasts all over as the milk comes in.
    A problem in one spot, or one breast only, is something else.

- id: inf2
  area: inflammation
  type: boolean
  ask: Can you feel a distinct lump you can get your fingers around, rather than a
    general firm, sore area?
  short: A distinct lump?
  assess: >
    A well-defined lump you can feel the edges of — rather than a spread-out
    firm, inflamed area.

- id: inf7
  area: inflammation
  type: boolean
  showIf: inf2
  ask: Is the lump soft or fluid-feeling and very tender, with red, thin, shiny
    skin over it?
  short: Soft, very tender lump + red skin?
  assess: >
    A tense, fluid-feeling, very painful lump with red thinned skin over it can
    be an abscess (a pocket of pus) and needs a scan and prompt treatment.

- id: inf8
  area: inflammation
  type: boolean
  showIf: inf2
  ask: Is the lump smooth, soft, and painless — not hot or tender?
  short: Smooth, soft, painless lump?
  assess: >
    A milk-filled cyst (galactocele) feels smooth and soft or tense, but is not
    hot or painful. It is most common as feeds drop off or after weaning.

- id: inf9
  area: inflammation
  type: multi
  ask: Looking in a mirror in good light, can you see or feel any of these?
  assess: >
    Dimpled or "orange-peel" skin, a nipple that has newly turned inward, and a
    hard lump that stays fixed in place all need a scan and a biopsy to rule out
    a rarer cause of a red, swollen breast. Tick any that apply.
  options:
    - finding: inf9-peau
      label: Dimpled or "orange-peel" skin on the breast
      short: Orange-peel skin
    - finding: inf9-retract
      label: A nipple that has recently turned inward
      short: Newly pulled-in nipple
    - finding: inf9-fixed
      label: A hard lump that stays fixed in one place
      short: Hard fixed lump

- id: inf9b
  area: inflammation
  type: boolean
  ask: Have you finished a course of antibiotics for this breast without it
    clearing up?
  short: Not cleared after antibiotics?
  assess: >
    A red, swollen breast that does not settle after an appropriate antibiotic
    course needs imaging, not another prescription. Answer "No" if you haven't
    had antibiotics for it.

- id: inf10
  area: inflammation
  type: boolean
  ask: Has inflammation or a lump come back more than once in the same spot?
  short: Keeps coming back, same spot?
  assess: >
    Repeated problems in exactly the same place suggest something fixed there — a
    blockage, a persistent blister, or an underlying lump — and are worth a scan.

- id: inf3
  area: inflammation
  type: boolean
  ask: Do you feel unwell with it — fever, shivers, body aches, racing heart?
  short: Feeling unwell / feverish?
  assess: >
    This separates a sore lumpy area where you feel basically well from mastitis,
    where you feel flu-like and unwell.

- id: inf4
  area: inflammation
  type: boolean
  ask: Has the red, sore area been getting worse?
  short: Getting worse?
  assess: >
    Early inflammation that is improving often settles on its own. An area that
    is spreading or getting more painful and swollen needs to be seen.

- id: inf4b
  area: inflammation
  type: boolean
  ask: Has the red, sore area lasted more than 2 days?
  short: Lasted more than 2 days?
  assess: >
    Inflammation that drags on beyond a couple of days, rather than easing, is
    more likely to need treatment.

- id: inf5
  area: inflammation
  type: boolean
  showIf: inf2
  ask: Has a scan or a doctor found a pocket of fluid or pus in the breast?
  short: Scan shows a fluid pocket?
  assess: >
    An ultrasound can show whether a firm area is a pocket of fluid (an abscess,
    which may need draining) or solid inflamed tissue. Choose "Not sure" if you
    have not had a scan.

- id: inf6
  area: inflammation
  type: boolean
  showIf: inf2
  ask: Is a firm area in the breast getting bigger instead of settling down?
  short: Firm area growing, not settling?
  assess: >
    A spreading mass of inflamed tissue with no drainable pocket is managed
    carefully with a breast specialist and should not be cut into. Choose "Not
    sure" if this does not apply to you.
