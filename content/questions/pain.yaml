# Questions the PARENT answers, in plain language. `short` is the label on the
# clinician's results grid. `showIf` hides a question until it makes sense — the
# finding then stays unknown, so nothing is ruled out.

- id: pain1
  area: pain
  type: boolean
  ask: Does the pain happen only in the first 30 seconds or so as the baby latches
    on, then ease once the milk flows?
  short: Pain only at latch-on?
  assess: >
    A sharp pinch as the baby draws the nipple in that goes away once milk is
    flowing, with the nipple looking rounded (not squashed flat or white) when
    the baby comes off.

- id: pain2
  area: pain
  type: boolean
  ask: Is there a wedge-shaped area of one breast that looks red and feels hot?
  short: Red, hot patch of breast?
  assess: >
    A section of the breast that is red and hot — usually also firm and tender —
    rather than pain only in the nipple, or a deep ache all over. This is the
    "mastitis" range of problems.

- id: pain3
  area: pain
  type: boolean
  ask: Can you see any change in the skin of your nipple or areola?
  short: Visible skin change?
  assess: >
    Look in good light for redness, flaking, a rash, a crack or sore, tiny
    blisters or crusting, a white spot on the tip, or a colour change. "No" means
    the skin looks normal.

- id: pain4
  area: pain
  type: boolean
  showIf: pain3
  ask: Apart from any plain crack, is there something unusual on the nipple skin
    — a blister cluster, small round sores, or yellow crusting?
  short: Unusual blisters / sores / crust?
  assess: >
    Something more than a plain crack. A cluster of little blisters or shallow
    round sores (sometimes with tingling first) can be a cold-sore-type (herpes)
    infection; honey-coloured crusting can be a bacterial skin infection. Both
    should be seen promptly.

- id: pain5
  area: pain
  type: boolean
  showIf: pain3
  ask: Is there a specific wound on the nipple — a crack, split, graze, bruise,
    or scab?
  short: Nipple wound / crack?
  assess: >
    A clear break in the skin, with pain in that exact spot — rather than a
    spread-out rash.

- id: pain6
  area: pain
  type: boolean
  showIf: pain5
  ask: After 2 to 3 days of care, is the nipple wound still not starting to heal?
  short: Wound not healing?
  assess: >
    A nipple crack that is being managed well usually starts to improve within a
    couple of days. One that is stuck, or getting worse, may be infected.

- id: pain6b
  area: pain
  type: boolean
  showIf: pain5
  ask: Around the nipple wound, is the redness spreading, or is there pus or
    yellow crusting?
  short: Spreading redness or pus?
  assess: >
    Spreading redness, pus, or yellow crusting around a nipple crack are signs it
    has become infected and needs to be seen.

- id: pain7
  area: pain
  type: boolean
  showIf: pain3
  ask: Is there a rash with a clear edge on the nipple or areola?
  short: Rash with a clear edge?
  assess: >
    A well-defined patch that is scaly, itchy, or burning. It can flare after a
    new cream, nipple cream, breast pads, fragrance, or laundry detergent, or go
    along with eczema or psoriasis elsewhere on your skin.

- id: pain8
  area: pain
  type: boolean
  showIf: pain3
  ask: Is there a small white or yellow spot at one point on the nipple, often in
    the same place each time?
  short: Recurring white spot on the nipple?
  assess: >
    A tiny blocked pore on the nipple (a "bleb" or milk blister), often coming
    back in the same spot, usually with a sore firm area in the breast behind it
    and on a background of a lot of milk.

- id: pain9
  area: pain
  type: boolean
  ask: Does the tip of your nipple turn white, then blue or red, especially after
    a feed or in the cold?
  short: Nipple turns white then blue / red?
  assess: >
    A colour change triggered by cold or the end of a feed, usually with a
    stinging or throbbing pain between feeds (not only during) that eases with
    warmth. Some people get the same thing in their fingers and toes.

- id: pain10
  area: pain
  type: boolean
  ask: Just before the milk lets down, do you get a sudden brief wave of dread,
    sadness, or hollowness that passes within a minute or two?
  short: Brief low feeling at let-down?
  assess: >
    A sudden dip in mood in the seconds before each let-down (including when
    pumping), lifting again within a minute or two, and you feel fine between
    feeds. It is a reflex tied to a brief hormone drop — not the same as
    postnatal depression, though the two can happen together.

- id: pain11
  area: pain
  type: boolean
  ask: Is there a deep, dull ache or burning inside the breast that carries on
    during and after feeds?
  short: Deep ache during + after feeds?
  assess: >
    A fairly constant deep ache or burning felt inside the breast (not on the
    nipple surface), there between feeds as well as during — often in both
    breasts and worse lower down. Often linked to a history of blocked ducts,
    blebs, cracked nipples, past mastitis, a lot of pumping, or oversupply.

- id: pain12
  area: pain
  type: boolean
  ask: Does light touch hurt — clothing brushing the nipple, the shower spray, or
    drying with a towel?
  short: Even light touch hurts?
  assess: >
    Pain from things that would not normally hurt can mean the nerves have become
    over-sensitive, especially if the breast looks normal and you have other
    conditions like fibromyalgia, migraine, or irritable bowel.
