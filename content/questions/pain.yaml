# Questions the PARENT answers, in plain language. `short` is the label on the
# clinician's results grid. `showIf` hides a question until it makes sense — the
# finding then stays unknown, so nothing is ruled out.

- id: pain1
  area: pain
  type: boolean
  ask: Does the pain happen only in the first 30 seconds or so as the baby latches
    on, then ease once the milk flows?
  short: Pain only at latch-on?
  assess: >
    A sharp pinch as the baby draws the nipple in that goes away once milk is
    flowing, with the nipple looking rounded (not squashed flat or white) when
    the baby comes off.

- id: pain2
  area: pain
  type: boolean
  ask: Is there a wedge or patch of your breast that is red, firm, hot, and sore
    (you may also feel feverish)?
  short: Red, firm, hot patch?
  assess: >
    A section of the breast that is red, hard, hot, and tender — rather than pain
    only in the nipple, or a deep ache all over. This is the "mastitis" range of
    problems.

- id: pain3
  area: pain
  type: boolean
  ask: Can you see any change in the skin of your nipple or areola?
  short: Visible skin change?
  assess: >
    Look in good light for redness, flaking, a rash, a crack or sore, tiny
    blisters or crusting, a white spot on the tip, or a colour change. "No" means
    the skin looks normal.

- id: pain4
  area: pain
  type: boolean
  showIf: pain3
  ask: Are there small blisters grouped together, small round ulcers, or
    golden-yellow crusty patches on the nipple?
  short: Blisters / ulcers / crusting?
  assess: >
    Clusters of little blisters or shallow round sores (sometimes with tingling
    first) can be a cold-sore-type (herpes) infection. Honey-coloured crusts can
    be a bacterial skin infection. Both should be seen promptly.

- id: pain5
  area: pain
  type: boolean
  showIf: pain3
  ask: Is there a specific wound on the nipple — a crack, split, graze, bruise,
    or scab?
  short: Nipple wound / crack?
  assess: >
    A clear break in the skin, with pain in that exact spot — rather than a
    spread-out rash.

- id: pain6
  area: pain
  type: boolean
  showIf: pain5
  ask: Has the nipple wound failed to heal after 2 to 3 days, or is the redness
    spreading or oozing pus or yellow crust?
  short: Wound not healing / infected?
  assess: >
    Signs that a nipple crack has become infected: not healing after a couple of
    days, spreading redness, pus, or yellow crusting.

- id: pain7
  area: pain
  type: boolean
  showIf: pain3
  ask: Is there a scaly, itchy, or burning rash with a clear edge on the nipple
    or areola?
  short: Scaly, itchy rash?
  assess: >
    A well-defined patch that is scaly, itchy, or burning. It can flare after a
    new cream, nipple cream, breast pads, fragrance, or laundry detergent, or go
    along with eczema or psoriasis elsewhere on your skin.

- id: pain8
  area: pain
  type: boolean
  showIf: pain3
  ask: Is there a white or yellow spot at one point on the nipple, with a tender
    firm line or lump in the breast behind it?
  short: White spot + tender lump behind?
  assess: >
    A tiny blocked pore on the nipple (a "bleb" or milk blister), often coming
    back in the same spot, with a sore firm area in the breast behind it.

- id: pain9
  area: pain
  type: boolean
  ask: Does your nipple turn white, then blue or red, especially in the cold —
    with pain between feeds as well as during?
  short: Nipple turns white then blue / red?
  assess: >
    A colour change triggered by cold, often with a stinging or throbbing pain
    between feeds that eases with warmth. Some people get the same thing in their
    fingers and toes.

- id: pain10
  area: pain
  type: boolean
  ask: Just before the milk lets down, do you get a sudden brief wave of dread,
    sadness, or hollowness that passes within a minute or two?
  short: Brief low feeling at let-down?
  assess: >
    A sudden dip in mood in the seconds before each let-down (including when
    pumping), lifting again within a minute or two, and you feel fine between
    feeds. It is a reflex tied to a brief hormone drop — not the same as
    postnatal depression, though the two can happen together.

- id: pain11
  area: pain
  type: boolean
  ask: Is there a deep, dull ache or burning inside the breast that carries on
    during and after feeds, often in both breasts and worse lower down?
  short: Deep ache during + after feeds?
  assess: >
    A fairly constant deep ache or burning felt inside the breast (not on the
    nipple surface), there between feeds as well as during. Often linked to a
    history of blocked ducts, blebs, cracked nipples, past mastitis, a lot of
    pumping, or oversupply.

- id: pain12
  area: pain
  type: boolean
  ask: Does light touch hurt — clothing brushing the nipple, the shower spray, or
    drying with a towel?
  short: Even light touch hurts?
  assess: >
    Pain from things that would not normally hurt can mean the nerves have become
    over-sensitive, especially if the breast looks normal and you have other
    conditions like fibromyalgia, migraine, or irritable bowel.
