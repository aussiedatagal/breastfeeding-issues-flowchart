- id: a7
  ask: Did copious milk ever “come in” (marked fullness / leaking) by about 72 hours?
  short: Milk came in?
  assess: Ask about breast fullness, heaviness, leaking, and a change in the infant's swallowing
    pattern in the first 3–4 days. ‘Never really came in’ points to a primary or lactogenesis-II
    problem; ‘came in, then faded’ points to a removal, drug, surgical or endocrine cause.
  ifYes: a10
  ifNo: a8
- id: a10
  ask: Are feeds infrequent or restricted, or displaced by top-ups?
  short: Feeds restricted?
  assess: "This is the commonest reversible cause of an established supply falling: anything that
    reduces the frequency or completeness of milk removal. The supplementation spiral is the
    classic loop — top-ups displace breast stimulation, which lowers supply, which prompts more
    top-ups."
  ifYes: dx-second
  ifNo: a11
- id: a11
  ask: Prior breast or chest surgery, radiation, or major injury?
  short: Breast surgery?
  assess: Ask specifically about reduction (especially with a free-nipple graft), augmentation
    with periareolar incisions, chest-wall radiation, burns or degloving injury, and prior
    abscess drainage — all can sever ducts or nerves. Note the interval since surgery and any
    prior successful lactation.
  ifYes: dx-surg
  ifNo: a12
- id: a12
  ask: An endocrine, drug, or pregnancy-related cause?
  short: Endocrine / drug?
  assess: "Supply-lowering drugs: combined oestrogen contraception, pseudoephedrine, high-dose
    progestins, ergometrine, cabergoline or bromocriptine, heavy alcohol. Check TSH and free T4,
    prolactin, and glucose; ask about lochia, a positive pregnancy test, and contraception
    started recently."
  ifYes: dx-endo
  ifNo: dx-idio
- id: a8
  ask: Signs of insufficient glandular tissue on breast exam?
  short: Hypoplastic breasts?
  assess: "Look for insufficient glandular tissue: breasts that did not enlarge in pregnancy or
    after birth, no or minimal engorgement, a tubular or conical shape, an intermammary gap over
    3–4 cm, bulbous areolae, or asymmetry greater than one cup size."
  ifYes: dx-igt
  ifNo: a9
- id: a9
  ask: Risk factors for delayed lactogenesis II present, with the infant still under about 2 weeks
    old?
  short: Delayed lactogenesis?
  assess: "Risk factors: caesarean or long labour, PPH, retained placenta, diabetes or GDM,
    obesity, PCOS, thyroid disease, severe stress or pain, flat affect, theca-lutein cysts. The
    window to intervene is the first 1–2 weeks."
  ifYes: dx-lac2
  ifNo:
    goto: a10
