# Questions the PARENT answers, in plain language. `short` is the label on the
# clinician's results grid.

- id: ref1
  area: refusal
  type: boolean
  ask: Did the refusal start suddenly, in a baby who had been feeding fine?
  short: Started suddenly?
  assess: >
    A clear change from settled, effective feeding — rather than feeding that was
    never comfortable or working well.
- id: ref2
  area: refusal
  type: boolean
  showIf: ref1
  ask: Can you think of something that set it off — an illness, teething, a big
    fright at the breast, or a change at home?
  short: Something set it off?
  assess: >
    Sudden refusal (a "nursing strike") usually has a cause. Worth checking the
    baby's ears, nose, and mouth, and thinking about recent changes, or a recent
    choking or milk-spraying episode at the breast.
- id: ref3
  area: refusal
  type: boolean
  ask: Does your baby latch on, then pull off crying or arching, and stay
    unsettled afterwards?
  short: Latches then pulls off crying, unsettled?
  assess: >
    A pattern of discomfort rather than distraction or fast flow: breaking off
    mid-feed crying and arching, hiccups, frequent bringing up of milk, poor
    sleep, and fussiness that carries on away from the breast. Worth checking the
    mouth for thrush and the ears.
- id: ref3b
  area: refusal
  type: multi
  showIf: ref3
  ask: Alongside the unsettled feeding, is any of this true?
  assess: >
    Blood or mucus in the poo, flaring eczema, and a close family history of
    allergy or asthma point towards a cow's-milk protein allergy rather than
    ordinary reflux. Tick any that apply.
  options:
    - finding: ref3b-blood
      label: Blood or mucus in your baby's poo
      short: Blood / mucus in poo
    - finding: ref3b-eczema
      label: Eczema that is getting worse
      short: Worsening eczema
    - finding: ref3b-family
      label: A parent or sibling with allergy, eczema, or asthma
      short: Family history of allergy
- id: ref4
  area: refusal
  type: boolean
  ask: Does your baby struggle or pull off early in the feed when the milk is
    flowing fast, then settle once it slows?
  short: Fights the fast flow early on?
  assess: >
    The baby is overwhelmed by the spray at let-down, clamps or pulls off, and
    feeds better once the flow eases.
- id: ref5
  area: refusal
  type: boolean
  ask: Is your baby around 3 to 4 months old and only feeds well when sleepy or
    in a quiet, dim room?
  short: 3–4 months, easily distracted?
  assess: >
    Around 3 to 4 months many babies become very distractible: they feed
    efficiently when drowsy, pull off often to look around, and feed better at
    night.
- id: ref6
  area: refusal
  type: boolean
  ask: Did the fussing start after regular bottle use, and does your baby take a
    fast bottle teat eagerly but fuss at the breast?
  short: Prefers the bottle since bottles started?
  assess: >
    Some babies come to prefer the fast, constant flow of a bottle teat and then
    fuss and pull at the breast, especially before the milk lets down.
- id: ref7
  area: refusal
  type: boolean
  ask: Has your baby had a lot of unpleasant experiences around the mouth (tubes,
    suctioning, force-feeding) and now pushes away anything near the mouth?
  short: Defensive about the mouth?
  assess: >
    Oral aversion follows negative experiences around the mouth: the baby is
    otherwise well and growing, but defends against anything approaching the
    mouth.
- id: ref8
  area: refusal
  type: boolean
  ask: Does your baby start okay but get more and more frustrated as the feed
    goes on, and take a bottle more calmly?
  short: Frustration builds through the feed?
  assess: >
    Frustration that builds through the feed can mean the flow is slow or the
    supply is falling — rather than fighting a fast flow at the start. If weight
    gain is also slipping, the milk-supply questions are worth doing too.
