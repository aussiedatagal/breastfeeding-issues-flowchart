- id: ref1
  area: refusal
  type: boolean
  ask: Was the refusal SUDDEN, in an infant who had been feeding well?
  short: Sudden onset?
  assess: A discrete change from established, effective feeding — as opposed to
    feeding that was never comfortable or effective.
- id: ref2
  area: refusal
  type: boolean
  ask: Is there an identifiable acute trigger?
  short: Acute trigger?
  assess: Nursing strikes almost always have a proximate cause. Examine ears,
    mouth and nose; ask about recent changes at home and a recent choking or
    spraying episode at the breast.
- id: ref3
  area: refusal
  type: boolean
  ask: Does the infant take the breast, then pull off crying, arch or stiffen, and
    stay windy or unsettled between feeds?
  short: Latches then pulls off crying?
  assess: >
    A discomfort pattern rather than a flow or distraction pattern: repeated
    breaking off mid-feed with crying and back-arching, hiccups, frequent
    posseting, disturbed sleep, and fussiness that continues away from the
    breast. Look in the mouth (thrush — white plaques that do not wipe off) and
    the ears (otitis) while you are there.
- id: ref3b
  area: refusal
  type: boolean
  ask: Blood or mucus in the stools, worsening eczema, or a strong first-degree
    family history of allergy or asthma?
  short: Blood/mucus stool or eczema?
  assess: >
    The cluster that separates cow's-milk protein allergy from uncomplicated
    reflux: visible blood streaks or mucus in the stool, eczema that flares, a
    first-degree family history of atopy, and often loose frequent stools.
    Feed-linked discomfort without any of these is usually reflux, managed by
    position and paced feeds alone.
- id: ref4
  area: refusal
  type: boolean
  ask: Does the infant fight the flow EARLY in the feed and settle later?
  short: Fast flow?
  assess: "Fast-flow refusal: the infant is overwhelmed by the ejection, clamps or
    pulls off as milk sprays, and feeds better once the flow slows."
- id: ref5
  area: refusal
  type: boolean
  ask: ~3–4 months old, feeding well only when sleepy or in a calm room?
  short: Distractible age?
  assess: "Developmental distractibility peaks around 3–4 months: efficient feeds
    when drowsy, frequent pulling off with the nipple still in the mouth, better
    feeding at night."
- id: ref6
  area: refusal
  type: boolean
  ask: Did refusal emerge after regular bottle use, with the infant preferring a
    fast teat flow?
  short: Teat preference?
  assess: "Flow preference: the infant roots and will take a bottle eagerly but
    fusses and pulls at the breast, especially before let-down."
- id: ref7
  area: refusal
  type: boolean
  ask: An aversive oral history, with defensive behaviour at the breast?
  short: Aversive history?
  assess: "Oral aversion follows negative oral experiences: the infant is
    otherwise well and growing on an alternative route but defends against
    anything approaching the mouth."
- id: ref8
  area: refusal
  type: boolean
  ask: Does the infant fuss and escalate THROUGH the feed, calmer on a bottle?
  short: Escalates through feed?
  assess: The pattern of frustration at a slow or falling supply — as opposed to
    fighting a fast flow at the start. If weight gain is also slipping, work the
    low-supply branch.
