- id: b5
  ask: Are there forceful-flow / oversupply signs as well?
  short: Oversupply signs?
  assess: "The paradox worth naming: brisk flow makes the infant choke, clamp and pull off, one
    breast drains poorly, and feeds look chaotic — which the parent reads as ‘not enough’."
  ifYes: dx-perc-over
  ifNo: dx-perceived
