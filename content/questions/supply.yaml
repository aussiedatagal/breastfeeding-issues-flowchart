# Questions the PARENT answers, in plain language. The clinical reasoning lives
# on the diagnosis side (educator-owned). `short` is the label shown on the
# clinician's results grid; keep it brief but still plain.

- id: q1
  area: supply
  type: boolean
  ask: As far as you know, has your baby's weight gain been on track?
  short: Weight gain on track?
  assess: >
    Your midwife, GP, or child health nurse can tell you if weight gain is on
    track from the growth chart. Choose "Not sure" if you don't know yet.

- id: a7
  area: supply
  type: boolean
  ask: In the first few days after birth, did your breasts become noticeably
    full, heavy, or leaky?
  short: Milk "came in"?
  assess: >
    Around day 2 to 4 most people feel their breasts get firmer, heavier, or
    start leaking as the milk increases. Some people never feel this; for others
    it happens and then fades.

- id: a10
  area: supply
  type: boolean
  ask: During the day, does your baby often go longer than about 3 hours between
    feeds?
  short: Long gaps between feeds?
  assess: >
    Long stretches without milk being removed — from scheduling, heavy dummy use,
    long sleeps, very short feeds, or regular formula top-ups — lower supply over
    time.

- id: a11
  area: supply
  type: boolean
  ask: Have you had breast or chest surgery, a serious chest injury, or radiation
    treatment?
  short: Breast / chest surgery?
  assess: >
    Breast reduction, some breast implant operations, chest radiotherapy, or a
    major chest injury can affect milk-making tissue or the nerves to the
    nipple.

- id: a12
  area: supply
  type: multi
  ask: Since your baby was born, have any of these happened?
  assess: >
    The combined (oestrogen) contraceptive pill, regular decongestant
    (pseudoephedrine) cold-and-flu tablets, a new pregnancy, and periods
    returning can each lower milk supply. Tick any that apply.
  options:
    - finding: a12-pill
      label: I've started the combined contraceptive pill
      short: On the combined pill
    - finding: a12-decongestant
      label: I've been taking decongestant (cold & flu) tablets regularly
      short: Taking decongestants
    - finding: a12-pregnant
      label: I've become pregnant again
      short: Pregnant again
    - finding: a12-periods
      label: My periods have come back
      short: Periods returned

- id: a8
  area: supply
  type: multi
  ask: Thinking about your breasts, is any of this true?
  assess: >
    A small number of people have less milk-making tissue. Breasts that did not
    change in pregnancy, a narrow or tube-like shape, a wide gap between them,
    and a big size difference are the markers. Tick any that apply.
  options:
    - finding: a8-nogrow
      label: They didn't grow or change much in pregnancy or after birth
      short: Little pregnancy growth
    - finding: a8-shape
      label: They are narrow, tube-shaped, or set wide apart
      short: Tubular / widely spaced
    - finding: a8-asym
      label: One is much larger than the other (more than a cup size)
      short: Very asymmetric

- id: a9
  area: supply
  type: boolean
  ask: Is your baby under about 2 weeks old?
  short: Under about 2 weeks old?
  assess: >
    The first week or two is the window when a slow start to the milk supply can
    still be turned around.

- id: a9b
  area: supply
  type: multi
  showIf: a9
  ask: Does any of this apply to you?
  assess: >
    A hard birth, heavy blood loss, diabetes, PCOS, thyroid problems, or
    retained placenta can all delay the milk coming in. Tick any that apply.
  options:
    - finding: a9b-birth
      label: A caesarean, a long labour, or heavy bleeding after birth
      short: Hard birth / haemorrhage
    - finding: a9b-diabetes
      label: Diabetes or gestational diabetes
      short: Diabetes
    - finding: a9b-thyroid
      label: A thyroid condition or PCOS
      short: Thyroid / PCOS
    - finding: a9b-placenta
      label: Part of the placenta was retained, or bleeding is still heavy
      short: Retained placenta

- id: b5
  area: supply
  type: boolean
  ask: Is your baby very windy, with green, frothy, or explosive poos?
  short: Windy + green, frothy poos?
  assess: >
    Sometimes there is plenty of milk but it comes too fast. The baby gulps air
    and gets a lot of the watery foremilk, so is windy and unsettled with green
    frothy nappies — which can look like "not enough" when it is really too
    much, too fast.

- id: a1
  area: supply
  type: boolean
  ask: During feeds, can you hear or see your baby swallowing regularly — not
    just quick fluttery sucks?
  short: Regular swallowing during feeds?
  assess: >
    A feed that is working has regular swallowing you can hear or see for much of
    the feed, then a softer breast and a settled baby. Not working: lots of
    fluttery sucking, few swallows, clicking or slipping off, falling asleep
    quickly, still frantic afterwards.

- id: a1b
  area: supply
  type: boolean
  ask: Does your baby actively fight, arch away, or refuse the breast, rather
    than latching on but feeding weakly?
  short: Fights / refuses the breast?
  assess: >
    This is about a baby who won't stay on the breast — crying, arching, turning
    away — rather than one who latches on but doesn't feed strongly.

- id: a2
  area: supply
  type: boolean
  ask: Has someone skilled sat with you through a feed and adjusted how your baby
    is held and latched?
  short: Had hands-on latch help?
  assess: >
    A midwife, lactation consultant, or breastfeeding counsellor working through
    a whole feed with you and hands-on adjusting the hold and latch — not just
    general advice.
- id: a2b
  area: supply
  type: boolean
  showIf: a2
  ask: Straight after that help, did the feeds get a lot better?
  short: Latch help fixed it?
  assess: >
    A clear improvement right away — deeper latch, more swallowing, less pain.
    Answer no if it did not really change things.

- id: a3
  area: supply
  type: boolean
  ask: Does your baby choke, clamp down, or pull off when the milk lets down and
    sprays?
  short: Chokes when milk sprays?
  assess: >
    A strong, fast let-down can make a baby clamp, pull off, gulp air, and
    struggle even when there is plenty of milk. Look for milk spraying when the
    baby comes off the breast.

- id: a4
  area: supply
  type: boolean
  ask: Even with good positioning, does your baby stay shallow on the breast,
    click, or keep slipping off?
  short: Signs of a tongue-movement problem?
  assess: >
    This is about how well the tongue moves, not how it looks: a shallow latch,
    clicking, sliding off, trouble staying on, and feeding that doesn't improve
    with better positioning. A lactation consultant or doctor can assess it.

- id: a5
  area: supply
  type: multi
  ask: Was any of this true for your baby?
  assess: >
    Being born early, jaundice, a difficult birth, a lot of pain relief in
    labour, and unusual muscle tone can all leave a baby with a weak or
    disorganised suck. Tick any that apply.
  options:
    - finding: a5-preterm
      label: Born more than 2 to 3 weeks early
      short: Preterm / early term
    - finding: a5-jaundice
      label: Jaundice that needed treatment
      short: Jaundice
    - finding: a5-birth
      label: A difficult birth, birth injury, or a lot of pain relief in labour
      short: Difficult birth / sedation
    - finding: a5-tone
      label: Floppy or unusually stiff muscle tone
      short: Abnormal tone

- id: a6
  area: supply
  type: boolean
  ask: Does your baby tire quickly during feeds and keep stopping to breathe or
    rest?
  short: Tires / breathless with feeds?
  assess: >
    A baby who runs out of steam quickly during feeds — sweating on the forehead,
    breathing fast, going pale or bluish, long pauses to recover — should be seen
    by a doctor, as this can point to a heart or breathing problem.

- id: a6b
  area: supply
  type: boolean
  ask: Are your breasts so full and firm that your baby can't latch on deeply?
  short: Too engorged to latch?
  assess: >
    In the early days, breasts that are very full and hard can flatten the nipple
    so the baby can't get a deep latch. Softening the areola first usually helps.

- id: a6c
  area: supply
  type: boolean
  ask: Are your nipples flat, or do they turn inward rather than sticking out?
  short: Flat / inverted nipples?
  assess: >
    Flat or inverted nipples can make the first latch harder, especially with a
    small or sleepy baby. Many babies manage with time and support.
