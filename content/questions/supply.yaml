# Questions the PARENT answers, in plain language. The clinical reasoning lives
# on the diagnosis side (educator-owned). `short` is the label shown on the
# clinician's results grid; keep it brief but still plain.

- id: q1
  area: supply
  type: boolean
  ask: Is your baby gaining weight well, with plenty of wet and dirty nappies?
  short: Weight & nappies on track?
  assess: >
    Your midwife, GP or child health nurse can tell you if weight gain is on
    track. After the first week, most babies have at least 6 heavy wet nappies a
    day. Choose "Not sure" if you don't know.
- id: a7
  area: supply
  type: boolean
  ask: In the first few days after birth, did your breasts become noticeably
    full, heavy, or leaky?
  short: Milk "came in"?
  assess: >
    Around day 2 to 4 most people feel their breasts get firmer, heavier, or
    start leaking as the milk increases. Some people never feel this; for others
    it happens and then fades.
- id: a10
  area: supply
  type: boolean
  ask: Are feeds often spaced out, cut short, or replaced by bottles of formula?
  short: Feeds spaced out or topped up?
  assess: >
    Long stretches without feeding, feeding to a schedule, heavy dummy use, or
    regular formula top-ups all reduce how often milk is removed — which lowers
    supply over time.
- id: a11
  area: supply
  type: boolean
  ask: Have you had breast or chest surgery, a serious chest injury, or radiation
    treatment?
  short: Breast / chest surgery?
  assess: >
    Breast reduction, some breast implant operations, chest radiotherapy, or a
    major chest injury can affect milk-making tissue or the nerves to the
    nipple.
- id: a12
  area: supply
  type: multi
  ask: Since your baby was born, have any of these happened?
  assess: >
    The combined (oestrogen) contraceptive pill, regular decongestant
    (pseudoephedrine) cold-and-flu tablets, a new pregnancy, and periods
    returning can each lower milk supply. Tick any that apply — leave them all
    unticked if none do.
  options:
    - finding: a12-pill
      label: I've started the combined contraceptive pill
      short: On the combined pill
    - finding: a12-decongestant
      label: I've been taking decongestant (cold & flu) tablets regularly
      short: Taking decongestants
    - finding: a12-pregnant
      label: I've become pregnant again
      short: Pregnant again
    - finding: a12-periods
      label: My periods have come back
      short: Periods returned
- id: a8
  area: supply
  type: boolean
  ask: Are your breasts narrow or tube-shaped, very different sizes, or set wide
    apart — and did they not grow much during pregnancy?
  short: Breast shape / little pregnancy change?
  assess: >
    A small number of people have less milk-making tissue. Signs can include
    breasts that didn't change in pregnancy, very little fullness in the first
    days after birth, a narrow or tube-like shape, large areolae, or a wide gap
    between the breasts.
- id: a9
  area: supply
  type: boolean
  ask: Is your baby under about 2 weeks old, and was the birth difficult
    (caesarean, long labour, heavy bleeding) or do you have diabetes, PCOS, or a
    thyroid condition?
  short: Under 2 weeks + hard birth / health issue?
  assess: >
    A hard birth, heavy blood loss, diabetes, PCOS, or thyroid problems can
    delay the milk coming in. The first week or two is the best time to get
    help.
- id: b5
  area: supply
  type: boolean
  ask: Does milk spray out fast so your baby chokes, splutters, or pulls off —
    and is your baby very windy with green, frothy, or explosive poos?
  short: Fast spray + windy, green poos?
  assess: >
    Sometimes there is plenty of milk but it comes too fast. The baby gulps,
    chokes, pulls off, swallows air, and has green frothy nappies — which can
    look like "not enough" when it is really too much, too fast.
- id: a1
  area: supply
  type: boolean
  ask: During a feed, can you hear or see your baby swallowing regularly for most
    of the feed, and does your breast feel softer afterwards?
  short: Regular swallowing, breast softens?
  assess: >
    A feed that is working: a deep comfortable latch, regular swallowing you can
    hear or see for much of the feed, the breast softening, and a settled baby
    afterwards. Not working: lots of fluttery sucking, few swallows, clicking or
    slipping off, falling asleep quickly, still frantic after.
- id: a1b
  area: supply
  type: boolean
  ask: Does your baby actively fight, arch away, or refuse the breast, rather
    than latching on but feeding weakly?
  short: Fights / refuses the breast?
  assess: >
    This is about a baby who won't stay on the breast — crying, arching, turning
    away — rather than one who latches on but doesn't feed strongly.
- id: a2
  area: supply
  type: boolean
  ask: When someone skilled helps you with positioning and latch, does feeding
    get a lot better straight away?
  short: Help with latch fixes it?
  assess: >
    If a midwife, lactation consultant, or breastfeeding counsellor adjusts how
    the baby is held and latched and the feed improves right away — deeper
    latch, more swallowing, less pain — answer yes.
- id: a3
  area: supply
  type: boolean
  ask: Does your baby choke, clamp down, or pull off when the milk lets down and
    sprays?
  short: Chokes when milk sprays?
  assess: >
    A strong, fast let-down can make a baby clamp, pull off, gulp air, and
    struggle even when there is plenty of milk. Look for milk spraying when the
    baby comes off, a windy baby, and frequent explosive green nappies.
- id: a4
  area: supply
  type: boolean
  ask: Has anyone mentioned tongue-tie, or does your baby seem unable to open
    wide, poke the tongue out, or stay latched?
  short: Tongue movement / tongue-tie?
  assess: >
    This is about how well the tongue moves, not how it looks. Signs can include
    a shallow latch, clicking, sliding off, and feeding that doesn't improve
    with better positioning. A lactation consultant or doctor can assess it.
- id: a5
  area: supply
  type: boolean
  ask: Was your baby born early or jaundiced, affected by a difficult birth or
    labour medicines, or does your baby have floppy or stiff muscle tone?
  short: Born early / birth or health issue?
  assess: >
    Babies born a few weeks early, or affected by jaundice, birth injury, or
    labour medicines, can have a weak or disorganised suck. So can some
    conditions that affect muscle tone.
- id: a6
  area: supply
  type: boolean
  ask: Does your baby feed eagerly for a few minutes then tire, sweat on the
    forehead, breathe fast, or go pale or bluish?
  short: Tires / colour change with feeds?
  assess: >
    A baby who runs out of steam quickly during feeds, sweats, breathes fast, or
    changes colour should be seen by a doctor — this can point to a heart or
    breathing problem.
- id: a6b
  area: supply
  type: boolean
  ask: Is something making it physically hard for your baby to latch — very firm,
    engorged breasts, or flat or inverted nipples?
  short: Hard to latch (engorged / nipple shape)?
  assess: >
    Sometimes latch is blocked by a physical barrier: breasts so full and firm
    the baby can't take enough in, or nipples that don't stick out.
