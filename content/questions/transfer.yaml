- id: a1
  ask: On a full feed observation, is milk transfer effective?
  short: Transfer effective?
  assess: Effective transfer = a deep comfortable latch, rhythmic suck with audible/visible
    swallowing that continues for most of the feed, the breast softening, and a contented infant
    with open hands afterwards. Ineffective = fluttery non-nutritive sucking, few swallows,
    frequent slipping or clicking, falling asleep early, no breast softening, still frantic
    after the feed.
  ifYes: a7
  ifNo: a1b
- id: a1b
  ask: Does the infant actively refuse or fight the breast (rather than attaching but feeding
    weakly)?
  short: Refusing?
  assess: Distinguish an infant who latches but transfers poorly (work the questions below) from
    one who arches, cries, turns away, or will not stay on the breast (work the refusal branch).
  ifYes:
    goto: ref1
  ifNo: a2
- id: a2
  ask: When a skilled helper optimises position and latch, does feeding become effective?
  short: Latch fixes it?
  assess: Try cross-cradle and laid-back positions, an asymmetric / exaggerated latch, and better
    head–body alignment and breast support. A positive answer = the latch deepens, swallowing
    becomes rhythmic, and pain settles there and then.
  ifYes: dx-position
  ifNo: a3
- id: a3
  ask: Does the infant choke, clamp or pull off as milk sprays?
  short: Forceful flow?
  assess: "Overactive let-down and oversupply can defeat transfer: the infant clamps to slow the
    flow, pulls off, swallows air, and may under-transfer despite an abundant supply. Look for
    spraying milk on release, a gassy infant, and frequent explosive green frothy stools."
  ifYes: dx-oald-a
  ifNo: a4
- id: a4
  ask: Functional tongue restriction, or a structural oral anomaly?
  short: Oral restriction?
  assess: Assess FUNCTION, not appearance — tongue elevation and extension, cupping, the strength
    and rhythm of the suck, and whether a lactation-trained clinician can improve transfer with
    an oral-motor manoeuvre. Posterior tongue restriction is the commonly missed one; a visible
    anterior frenulum alone is not a diagnosis. Check the palate and jaw, and look for a bifid
    uvula (submucous cleft).
  ifYes: dx-oral
  ifNo: a5
- id: a5
  ask: Prematurity, abnormal tone, birth injury, jaundice, or sedation?
  short: Immature / neuro?
  assess: Late-preterm and early-term infants have a disorganised, fatigable suck–swallow–breathe
    pattern. Also consider hypotonia (trisomy 21, prematurity, hypothyroidism, neuromuscular
    disease), hypertonia, birth injury (cephalohaematoma, clavicle fracture, torticollis,
    facial-nerve palsy, brachial plexus injury, HIE), hyperbilirubinaemia causing sleepiness,
    and sedating intrapartum drugs.
  ifYes: dx-suck
  ifNo: a6
- id: a6
  ask: Does the infant tire, sweat, or change colour during feeds?
  short: Tires / cyanoses?
  assess: A cardiorespiratory cause presents as an infant who feeds keenly for a few minutes then
    fatigues, sweats on the forehead, becomes tachypnoeic or dusky, and fails to thrive. Examine
    for a murmur, hepatomegaly, and respiratory rate at rest and during a feed.
  ifYes: dx-cardio
  ifNo: a6b
- id: a6b
  ask: A physical barrier to latch — engorgement, or nipple shape?
  short: Mechanical barrier?
  assess: "A physical barrier to latch: an areola too firm to draw in (engorgement, days 2–5), a
    nipple that will not evert on a pinch test, or a nipple / breast disproportionate to a small
    or preterm mouth."
  ifYes: dx-barrier
  ifNo: dx-transfer-unk
